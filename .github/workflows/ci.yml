name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-contract:
    name: Model contract and source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q src app scripts

      - name: Run complete test suite
        run: python -m pytest -q

  container-builds:
    name: Container build checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --file Dockerfile --tag nairobi-flood-api:ci .

      - name: Build dashboard image
        run: docker build --file Dockerfile.ui --tag nairobi-flood-ui:ci .

      # A successful image build does not prove that native geospatial
      # dependencies load. Start the real API and exercise its readiness route.
      - name: Start API image and check readiness
        run: |
          # Match Render's free-instance memory ceiling so a successful build
          # cannot mask an out-of-memory failure at deployment time.
          docker run --detach --memory 512m --memory-swap 512m --name nairobi-flood-api-ci --publish 8000:8000 nairobi-flood-api:ci
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://localhost:8000/health; then
              docker stop nairobi-flood-api-ci
              exit 0
            fi
            sleep 2
          done
          docker logs nairobi-flood-api-ci
          docker rm --force nairobi-flood-api-ci
          exit 1
