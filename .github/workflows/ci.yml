name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-contract:
    name: Model contract and source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q src app scripts

      # Raw GeoTIFFs are deliberately excluded from version control. These
      # tests exercise the tracked model artefact and selection behaviour.
      - name: Run model-contract tests
        run: python -m pytest -q tests/test_models.py

  container-builds:
    name: Container build checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --file Dockerfile --tag nairobi-flood-api:ci .

      - name: Build dashboard image
        run: docker build --file Dockerfile.ui --tag nairobi-flood-ui:ci .
